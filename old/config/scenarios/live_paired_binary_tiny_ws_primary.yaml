# Live tiny paired-binary — Phase 2 WS-primary sanity rerun.
#
# Preserves tiny/safe risk caps from live_paired_binary_tiny.yaml and adds the
# full M8 WS-primary runtime posture. Strategy logic/params come from
# config/strategies/paired_binary.yaml (unchanged).
#
# Token IDs default from strategy YAML (shadow_test_market). If preflight fails
# on notional/depth/spread, pin a balanced market via strategy overlay (see
# m8_ws_primary_validation_002.yaml) or run scripts/m8_market_preflight.py first.
#
# Preflight:
#   python scripts/phase2_live_preflight_check.py --scenario live_paired_binary_tiny_ws_primary
#
# Run:
#   python -m tyrex_pm.runtime.app run \
#     --strategy config/strategies/paired_binary.yaml \
#     --scenario live_paired_binary_tiny_ws_primary \
#     --run-name paired_binary_ws_primary_live_$(date +%s)
#
# Post-run:
#   python scripts/validate_paired_binary_phase2_live_run.py var/reporting/runs/<run-name>

execution_mode: live

runtime:
  market_data:
    enabled: true
    max_book_age_s: 5
    websocket:
      primary_enabled: true
      shadow_enabled: false
    rest:
      poll_enabled: false
      bootstrap_on_startup: true
      recovery_on_reconnect: true
    quality:
      enforcement_mode: enforce
      require_ws_primary_for_entry: true
      allow_rest_recovery_for_exit: true
      allow_rest_recovery_for_entry: false
      market_profile: crypto_5m
    features:
      v0_enabled: true
  execution:
    planner:
      enabled: true
      require_fresh_book_for_urgent: true
      max_book_age_s: 5
      use_executable_depth: true
  observability:
    emit_decision_snapshot: true
  paired_binary:
    poll_interval_s: 1.0
    max_decision_rate_per_market_ms: 75
    open_exposure_on_max_runtime: force_reduce_only_exit
    open_exposure_timeout_s: 300
    survivor_on_max_runtime: force_reduce_only_exit
    survivor_timeout_s: 300
    allow_terminal_state_resume: false
    market_timing_diagnostics:
      enabled: true
      near_close_window_s: 45
  allocation_ledger:
    clamp_grace_s_after_buy: 90

risk:
  notional:
    min_usd: "1"
    max_usd: "15"
    max_policy: cap
  deployment:
    token_cap_usd: "20"
    portfolio_cap_usd: "30"
  exits:
    allow_reduce_only_mark_fallback: true
    require_fresh_book_for_mark_fallback: true
    urgent_exit_max_book_age_s: 0.5
  venue_min_size:
    enabled: true
    policy: deny
    default_min_size: "5"
  readiness:
    require_wallet_sync: true
    max_wallet_age_s_live: 120
    require_heartbeat_live: true
    require_user_ws_live: true
