[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tyrex-pm"
version = "0.3.0"
description = "Polymarket-focused event-driven trading framework (clean reset)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
tyrex-pm = "tyrex_pm.application.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tyrex_pm*"]
exclude = ["old*", "tests*", "Docs*", "config*", "scripts*", "var*"]

[tool.setuptools.package-data]
tyrex_pm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [".git", ".venv", "venv", "old", "var", "Docs", "config", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["old", "var"]

[tool.ruff.lint]
# Minimal until R2 contracts land.
select = ["E", "F", "I"]

[tool.coverage.run]
source = ["tyrex_pm"]
omit = ["old/*", "tests/*"]

[tool.coverage.report]
omit = ["old/*"]
