# Closed-loop strategy replay: FAVORABLE execution assumptions.
# Explicitly generous: explores model behaviour under easy fills. Not a profitability
# bound, not a calibrated latency, not historical fees. Research use only.
schema_version: 1
adapter: strategy_closed_loop_v1
name: favorable
initial_cash: '100'
feed_delay_ms: 0          # information delay: recorded row -> strategy view
decision_delay_ms: 0      # compute time
order_delay_ms: 0         # submission -> venue arrival
cancel_delay_ms: 0
feedback_delay_ms: 0      # venue result -> strategy context
adverse_price_ticks: 0    # fills at displayed level prices
participation: '1'        # all displayed depth up to the limit is available
timer_interval_ms: 1000
quality_predicate: valid_books_at_actions
maker_model: no_fill
maker_queue_multiplier: '2'
gap_policy: invalidate_path
tie_policy: observations_before_actions
seed: 0
settlement_release_delay_ms: 60000
fee_policy:
  version: explicit_scenario_v1
  mode: scenario
  rate: '0.07'
  exponent: 1
  quantum: '0.00001'
  buy_fee_unit: shares
  maker_rate: '0'
  provenance: SCENARIO_ASSUMPTION_NOT_VERIFIED_HISTORICAL_FEES
