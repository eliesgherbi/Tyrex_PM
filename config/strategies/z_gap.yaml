# Z-Gap strategy — Phase A observe-only first (A0.1 scaffold).
kind: z_gap

enabled: true

z_gap:
  owner_id: z_gap
  # Default entry mode; enforce is gated by preflight artifacts.
  entry_mode: observe_only

  market_id: "btc_5m_<YYYYMMDD_HHMM>"
  condition_id: "<required>"
  event_start_ts: null
  event_end_ts: null
  yes_token_id: "<required>"
  no_token_id: "<required>"

  run_once: true

  sigma:
    estimator: ewma
    half_life_s: 30
    min_samples_s: 20
    jump_guard: true
    jump_threshold_sigma: 4.0
    sample_interval_s: 1
    tau_floor_s: 1

  entry:
    theta_take: "0.05"
    theta_fill_floor: "0.03"
    z_band: ["0.8", "2.2"]
    tau_band_s: [60, 210]
    basis_max_bps: "3"
    expected_slippage_ticks: 1
    one_position_per_window: true
    no_reentry_after_exit: true

  sizing:
    mode: fixed_usd
    max_usd: "5"
    min_shares: "5"

  exit:
    z_stop: "0.25"
    stop_confirm_s: 1
    flatten_before_event_end_s: 20
    retry_interval_ms: 1000
    max_exit_attempts: 5

  ptb:
    capture_wait_timeout_ms: 5000
    max_usable_boundary_lag_ms: 5000
    poll_interval_ms: 100

  model_sanity:
    warn_abs_z: 8
    block_abs_z: 20
