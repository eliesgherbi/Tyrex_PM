# Live one-shot runtime profile for --mode live.
# source: live = real public market data (NOT the same as CLI --mode live).
# Market selection: N7 discovers exactly one upcoming BTC 5m window (no event_slug).
# No rollover into a second market (one_shot + N7 host refuse_second_window).

source: live

# Chainlink sealed_k is PTB authority; SSR openPrice match is not required.
require_ssr_price_match: false
market_family: btc_updown_5m
one_shot: true

binance_symbol: BTCUSDT
signal_max_book_spread: "0.50"

freshness:
  book_threshold_ms: 120000
  reference_threshold_ms: 120000
  future_tolerance_ms: 500
  timestamp_basis: EVENT_TIME

# Host wiring placeholders (N7 discovers window / seals K at boundary).
window_id: live-btc-updown-5m
ptb_k: "0"
resolution_capability: false
evaluate_on_reference: false
evaluate_interval_s: 1.0
timer_eval_count: 2

momentum_lookback_ms: 5000
momentum_threshold: "0.001"
momentum_min_samples: 2
