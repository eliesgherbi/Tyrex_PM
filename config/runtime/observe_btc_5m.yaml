# Runtime / data-source configuration for fixture BTC 5m Z-Gap OBSERVE/SHADOW.
# Owner: runtime (not strategy).
#
# CLI --mode observe|shadow selects host behavior.
# This file's `source` selects fixture vs public live inputs.

# Data source: fixture | live  (maps to ObserveConfig.mode internally).
source: fixture

# Required when source=fixture. Deterministic Z-Gap observe fixture (no network).
# Compatible with ObserveHost.load_market_from_fixture (condition_id + tokens).
fixture_path: "tests/fixtures/z_gap/observe_f3_window.json"

# Binance reference symbol (uppercase enforced). Reference-data only.
binance_symbol: "BTCUSDT"

# Host/signal book-spread gate → ObserveConfig.max_book_spread.
# Used by ReferenceMomentum directional signal; Z-Gap binding currently ignores it.
# Distinct from risk.max_spread (RiskEngine intent gate).
signal_max_book_spread: "0.50"

freshness:
  # Max book age (ms) for FRESH assessment. Larger → more tolerant of stale books.
  book_threshold_ms: 120000
  # Max reference (Binance) age (ms).
  reference_threshold_ms: 120000
  # Allow timestamps this far in the future (ms) before FUTURE_TIMESTAMP.
  future_tolerance_ms: 500
  # EVENT_TIME | RECEIVE_TIME — which timestamp freshness uses.
  timestamp_basis: "EVENT_TIME"

# Wall-clock run duration for live source (seconds); null = fixture-driven / unbounded.
runtime_duration_s: null

# When true, evaluate on each ReferencePriceUpdated; false = book/timer driven.
evaluate_on_reference: false

# Host timer evaluation interval (seconds) for fixture FakeClock path.
evaluate_interval_s: 1.0

# Number of deterministic timer evaluations in fixture runs (>= 0).
timer_eval_count: 2

# Fixture market/window identity for PTB binding (not a strategy math parameter).
window_id: "zgap-f3-w1"

# Fixture sealed PTB K (price). Positive Decimal string.
ptb_k: "100000"

# Composition-supplied resolution capability (operational). default: false
resolution_capability: false

# Optional fixture path fragment for resolution evidence events; null disables.
resolution_evidence_path: null

# Live-source market selectors (unused for source=fixture).
event_slug: null
event_url: null
condition_id: null

# ObserveHost still constructs momentum indicator fields even for z_gap
# (ZGapBinding ignores them). Kept explicit for complete host wiring.
momentum_lookback_ms: 5000
momentum_threshold: "0.001"
momentum_min_samples: 2
