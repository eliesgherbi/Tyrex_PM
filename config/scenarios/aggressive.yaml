# Leaf-level scenario overlay named "aggressive".
# Selected with: --scenario aggressive
#
# Only overrides existing schema leaves. No inheritance / includes / expressions.
# Demonstrates looser entry thresholds + wider risk spread + shorter shadow hold.

strategy:
  parameters:
    entry:
      # Lower edge hurdle → more candidate entries in evaluation.
      theta_take: "0.02"
      # Wider |z| band lower bound.
      z_min: "0.5"

risk:
  # Allow wider books through RiskEngine (intent gate).
  max_spread: "0.80"

execution:
  shadow:
    # Shorter max hold for shadow experiments (seconds).
    max_hold_s: 300

runtime:
  # Bound live runs; fixture path still terminates via fixture/timers.
  runtime_duration_s: 120
