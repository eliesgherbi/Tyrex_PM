# Execution for SHADOW — activates ShadowOMS (simulated fills only; no venue mutation).
# Use with: tyrex-pm run --mode shadow --execution config/execution/shadow_example.yaml
#
# All fields map to ShadowConfig. Owner: execution (planner/OMS mechanics).

kind: shadow

shadow:
  # Required true for --mode shadow (validated at resolve time).
  enable_oms: true

  # Max notional for a single shadow position. type: Decimal string > 0
  max_position_notional: "20"

  # Max aggregate shadow exposure. type: Decimal string > 0
  max_total_exposure: "50"

  # Max hold time before shadow flatten pressure (seconds). Must be > 0. default used in code: from YAML
  max_hold_s: 600

  # Shadow OMS flatten this many seconds before close (distinct from strategy flatten_before_event_end_s).
  flatten_before_close_s: 20

  # When true, exit path aims for flat. default pattern: true
  exit_on_flat: true

  # Local snapshot path under var/state (gitignored). Persistence for shadow recovery.
  persistence_path: "var/state/z_gap_shadow_snapshot.json"

  # Cancel unfilled residuals on exit path when true.
  cancel_unfilled_residual: false

  # Shadow fee rate applied to simulated fills (0 = zero-fee model). Decimal string.
  fee_rate: "0"

  # Fee model identifier recorded on facts (label only).
  fee_model_id: "shadow_zero_fee_v1"

  # Entry retry cooldown (seconds) after failed/unacked entry. Must be > 0.
  entry_retry_cooldown_s: 5.0

  # Max entry attempts before giving up. Must be >= 1.
  entry_max_attempts: 3

  # Exit retry cooldown (seconds). Must be > 0.
  exit_retry_cooldown_s: 3.0

  # Max normal exit retries. Must be >= 1.
  exit_max_normal_retries: 3

  # Escalate exit aggressiveness after this many attempts.
  exit_escalate_after: 2

  # Require confirmed FLAT before promoting prepared-next window (N5).
  require_flat_for_promote: true

  fills:
    # Fill model id. depth_walk simulates walking the book; immediate_* fills at touch.
    # Known models include shadow_depth_walk_v1 and shadow_immediate_visible_depth_v0.
    model_id: "shadow_depth_walk_v1"
    # Artificial fill latency (ms) in the shadow model. >= 0
    latency_ms: 250
    # Extra slippage in ticks beyond depth walk. Decimal string >= 0
    extra_slip_ticks: "0"
    # Tick size for slip conversion. Decimal string
    tick_size: "0.01"
