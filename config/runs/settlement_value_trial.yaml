# settlement_value SUPERVISED SMALL-MONEY TRIAL profile (S6). Operator use only.
#
# One entry episode per process run. A confirmed fill is committed to resolution: the
# host does not sell it before close or at shutdown. Resolution, payout proof and the
# redemption worklist are handled by `tyrex-pm settlement ...` against the durable ledger.
#
# Before any real run (see Docs/implementation/strategies/research_to_live_plan.md):
#  * S0 settlement semantics must be established for the actual contract;
#  * observation (config/observe/settlement_value_observe.yaml) must have been reviewed;
#  * set redemption_wallet to the funder/proxy address that holds the position.
# Validate offline:   tyrex-pm run --config config/runs/settlement_value_trial.yaml --validate-config
schema_version: 1
run_name: settlement_value_trial
strategy:
  kind: settlement_value
  parameters:
    settlement:
      functional_id: twap60_at_close_vs_open
      comparison: AT_OR_ABOVE_K
      reference_series: polymarket_rtds:crypto_prices_chainlink:btc/usd
      provenance_status: ASSUMED
    model:
      backend: twap_proxy_diffusion
      sigma_band: 0.25
      reference_band_bps: 1.0
    volatility:
      half_life_s: 30.0
      min_samples_s: 20.0
      sample_interval_s: 1.0
      sigma_floor: 0.00001
    entry:
      tau_min_s: 30
      tau_max_s: 240
      min_edge_per_share: "0.03"
      target_mode: cap_only        # budget-constrained; $3 stays a research target
      max_entry_price: "0.95"
      limit_buffer_ticks: 1
    sizing:
      max_debit_usdc: "5"
      max_loss_usdc: "5"
      depth_participation: "1"
    quality:
      # Live K without SSR attestation is PROVISIONAL; keep CONFIRMED_CANONICAL only to
      # require attestation (set market.require_ssr_price_match: true).
      accepted_k_qualities: [CONFIRMED_CANONICAL, PROVISIONAL]
      max_clock_uncertainty_ms: 750
    fees:
      # Must equal the market's published fee schedule or the host blocks the entry.
      rate: "0.07"
      exponent: "1"
      provenance: MUST_MATCH_PROVIDER_FEE_SCHEDULE
market:
  family: btc_updown_5m
  binance_symbol: BTCUSDT
  require_ssr_price_match: false
  preparation_lead_s: 45
  maximum_duration_s: 300
  evaluation_interval_s: 1
  maximum_book_age_ms: 2000
  maximum_candidate_age_ms: 5000
account:
  refresh_interval_s: 5
  snapshot_max_age_s: 15
  read_timeout_s: 4
  retry_attempts: 3
  retry_base_delay_s: 0.25
risk:
  target_notional: "5"
  maximum_total_debit: "5"
  fee_reserve_rate: "0.02"
lifecycle:
  mode: hold_to_resolution
  # Pre-commit fallback only: an uncommitted position is still flattened by these.
  mandatory_exit_before_end_s: 20
  manual_deadline_before_end_s: 5
  evidence_timeout_s: 15
  reconciliation_interval_s: 0.25
  exit_retry_limit: 3
  exit_retry_budget_s: 10
  minimum_exit_price: "0.01"
  sell_size_increment: "0.01"
  dust_abs_shares: "0.01"
  dust_max_notional: "0.05"
  prepare_budget_ms: 2000
  refresh_wait_budget_ms: 500
settlement:
  ledger_path: var/runtime_state/settlement/settlement_value_trial.jsonl
  hold_commit_budget_s: 10
  redemption_mode: operator
  # redemption_wallet: "0x..."   # required for `settlement confirm-redemption`
  trial:
    max_debit_per_episode: "5"
    max_episodes: 10
    max_unresolved_count: 1        # with startup serialisation: one holding at a time
    max_unresolved_cost: "5"
    trial_loss_budget: "20"
state_directory: var/runtime_state/execution
report_directory: var/runs/settlement_value_trial
